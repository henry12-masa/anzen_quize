<script>
  let level = "easy";
  let current = 0;
  let score = 0;
  let correctAnswer = 0;
  let timeLeft = 60;
  let timer = null;
  let totalQuestions = 10;

  const problemEl = document.getElementById("problem");
  const answerEl = document.getElementById("answer");
  const statusEl = document.getElementById("status");
  const qNumEl = document.getElementById("qNum");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");

  function startGame(selectedLevel) {
    level = selectedLevel;
    current = 0;
    score = 0;

    if (level === "easy") timeLeft = 60;
    if (level === "normal") timeLeft = 50;
    if (level === "hard") timeLeft = 40;
    if (level === "oni") timeLeft = 30;

    document.getElementById("start").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("result").style.display = "none";

    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;

    nextQuestion();

    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        finishGame();
      }
    }, 1000);
  }

  function nextQuestion() {
    if (current >= totalQuestions) {
      finishGame();
      return;
    }

    current++;
    qNumEl.textContent = current;
    statusEl.textContent = "";
    answerEl.value = "";
    answerEl.focus();

    const q = createProblem(level);
    problemEl.textContent = q.text;
    correctAnswer = q.answer;
  }

  function createProblem(level) {
    let a, b, c, op, text, answer;

    if (level === "easy") {
      a = rand(1, 20);
      b = rand(1, 20);
      op = randomItem(["+", "-"]);

      if (op === "+") {
        answer = a + b;
      } else {
        if (b > a) [a, b] = [b, a];
        answer = a - b;
      }

      text = `${a} ${op} ${b}`;
    }

    if (level === "normal") {
      a = rand(10, 99);
      b = rand(2, 20);
      op = randomItem(["+", "-", "?"]);

      if (op === "+") answer = a + b;
      if (op === "-") {
        if (b > a) [a, b] = [b, a];
        answer = a - b;
      }
      if (op === "?") answer = a * b;

      text = `${a} ${op} ${b}`;
    }

    if (level === "hard") {
      a = rand(20, 99);
      b = rand(10, 50);
      c = rand(2, 9);
      op = randomItem(["+", "-", "?"]);

      if (op === "+") {
        answer = a + b + c;
        text = `${a} + ${b} + ${c}`;
      }

      if (op === "-") {
        answer = a + b - c;
        text = `${a} + ${b} - ${c}`;
      }

      if (op === "?") {
        answer = a * c + b;
        text = `${a} ? ${c} + ${b}`;
      }
    }

    if (level === "oni") {
      a = rand(50, 199);
      b = rand(10, 99);
      c = rand(2, 12);
      op = randomItem(["mix1", "mix2", "mix3"]);

      if (op === "mix1") {
        answer = a + b * c;
        text = `${a} + ${b} ? ${c}`;
      }

      if (op === "mix2") {
        answer = (a - b) * c;
        text = `(${a} - ${b}) ? ${c}`;
      }

      if (op === "mix3") {
        answer = a * c - b;
        text = `${a} ? ${c} - ${b}`;
      }
    }

    return { text, answer };
  }

  function checkAnswer() {
    const userAnswer = Number(answerEl.value);

    if (answerEl.value === "") {
      statusEl.textContent = "???????????";
      statusEl.style.color = "#d93025";
      return;
    }

    if (userAnswer === correctAnswer) {
      score++;
      scoreEl.textContent = score;
      statusEl.textContent = "???";
      statusEl.style.color = "#1f9d55";
    } else {
      statusEl.textContent = `??????? ${correctAnswer}`;
      statusEl.style.color = "#d93025";
    }

    setTimeout(nextQuestion, 700);
  }

  function skipQuestion() {
    statusEl.textContent = `???????? ${correctAnswer}`;
    statusEl.style.color = "#777";
    setTimeout(nextQuestion, 700);
  }

  function finishGame() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.getElementById("result").style.display = "block";

    let message = "";

    if (score >= 9) {
      message = "??????????????";
    } else if (score >= 6) {
      message = "?????????????????";
    } else if (score >= 3) {
      message = "?????????????????";
    } else {
      message = "???????????????????????";
    }

    document.getElementById("result").innerHTML = `
      <div class="result">
        <h2>????</h2>
        <p>${totalQuestions}?? ${score}? ??</p>
        <p>${message}</p>
        <button onclick="location.reload()">???????</button>
      </div>
    `;
  }

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  answerEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      checkAnswer();
    }
  });
</script>
